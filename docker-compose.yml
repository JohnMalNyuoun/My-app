services:
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ../todo-app/todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-data:/data/db

  redis:
    image: redis
    volumes:
      - redis-data:/data

  backend:
    image: my-app-backend
    build:
      context: ../todo-app/todo-backend
      dockerfile: ../../my-app/backend/Dockerfile
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://the_username:the_password@mongo:27017/the_database?authSource=the_database
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

  frontend:
    image: my-app-frontend
    build:
      context: ../todo-app/todo-frontend
      dockerfile: ../../my-app/frontend/Dockerfile
      args:
        VITE_BACKEND_URL: /api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mongo-data:
  redis-data:
