services:
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ../todo-app/todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-data:/data/db

  redis:
    image: redis
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ../todo-app/todo-backend
      dockerfile: ../../my-app/backend/dev.Dockerfile
    volumes:
      - ../todo-app/todo-backend:/usr/src/app
      - backend-node-modules:/usr/src/app/node_modules
    environment:
      MONGO_URL: mongodb://the_username:the_password@mongo:27017/the_database?authSource=the_database
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ../todo-app/todo-frontend
      dockerfile: ../../my-app/frontend/dev.Dockerfile
    environment:
      VITE_BACKEND_URL: /api
    volumes:
      - ../todo-app/todo-frontend:/usr/src/app
      - frontend-node-modules:/usr/src/app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  backend-node-modules:
  frontend-node-modules:
  mongo-data:
  redis-data:
